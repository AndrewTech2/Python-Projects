<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latest News</title>
    {{ bootstrap.load_css() }}
</head>
<body>
    <div class="px-4 py-5 my-5 text-center">
    <h1 class="display-5 fw-bold text-body-emphasis">HackerNews Top News</h1>
    <div class="col-lg-6 mx-auto">
      <p class="lead mb-4">Quickly view the top news right here.</p>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <button type="button" class="btn btn-primary btn-lg px-4 gap-3">Let's go!</button>
      </div>
      <ul class="list-group" style="margin-top: 30px;">
          {% for item in items: %}
          <li class="list-group-item"><a href="{{ items[item]['url'] }}">{{ items[item]['title'] }}</a>: {{ items[item]['scores'] }} votes</li>
          {% endfor %}
      </ul>
    </div>
  </div>
</body>
</html>
