{% extends 'header.html' %} {% block content %}
<div class="d-flex align-items-center py-4 bg-body-tertiary">
<main class="form-signin w-100 m-auto">
  <form action="/check_user" method="post">
    <h1 class="h3 mb-3 fw-normal">Please login. It's easy and effective.</h1>
    {% if error=='incorrect': %}
    <p><strong>Password and email not matching.</strong></p>
    {% endif %}
    <div class="form-floating">
      <input required name='email' type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
      <label for="floatingInput">Email address</label>
    </div>
    <div class="form-floating">
      <input required name='password' type="password" class="form-control" id="floatingPassword" placeholder="Password">
      <label for="floatingPassword">Password</label>
    </div>
    <button style="margin-top: 10px;" class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
  </form>
</main>
</div>
{% endblock %}
