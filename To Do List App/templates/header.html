<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <title>To Do List</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <Style>
    body {
      font-family: 'Courier New', monospace;
    }
  </Style>
</head>
<body style="background-color: #B1F0F7">
<div class="container">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-md-3 mb-2 mb-md-0">
        <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <span class="fs-4">To-Do List</span>
        </a>
      </div>
      {% if 'name' not in session: %}
      <div class="col-md-3 text-end">
        <button type="button" class="btn btn-outline-primary me-2"><a style="text-decoration: none;" href="/login">Login</a></button>
        <button type="button" class="btn btn-primary"><a style='color: white; text-decoration: none;' href="/">Sign-Up</a></button>
      </div>
      {% else: %}
        <div class="col-md-3 text-end">
        <button type="button" class="btn btn-outline-primary me-2"><a style="text-decoration: none;" href="/logout">Log out</a></button>
      </div>
      {% endif %}
    </header>
  </div>
{% block content %} {% endblock %}
<footer>
  <div class="container">
  <footer class="py-3 my-4" style="border-top: 1px solid blue;">
    <p class="text-center text-body-secondary">© 2024 Andrei Ivan</p>
  </footer>
</div>
</footer>
</body>
</html>
