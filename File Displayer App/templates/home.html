<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Displayer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="px-4 py-5 my-5 text-center">
    <h1 class="display-5 fw-bold">File Content Reader</h1>
    <div class="col-lg-6 mx-auto">
      <p class="lead mb-4">Quickly read the contents of any file.</p>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" class="btn btn-primary btn-lg px-4 gap-3" name="file">
        <button type="submit" class="btn btn-primary btn-lg px-4 gap-3">Submit</button>
        </form>
      </div>
    </div>
    {% if content: %}
    <p class="lead mb-4">File content:</p>
    {% for line in content: %}
    <p class="lead mb-4" style="margin-bottom: -50px;">{{ line }}</p>
    {% endfor %}
    {% endif %}
  </div>
</body>
</html>
