<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Chat App</title>
    {{ bootstrap.load_css() }}
</head>
<body>
    <div class="container">
    <header class="d-flex justify-content-center py-3">
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="/" class="nav-link" aria-current="page">Home</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Features</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Pricing</a></li>
        <li class="nav-item"><a href="#" class="nav-link">FAQs</a></li>
        <li class="nav-item"><a href="#" class="nav-link">About</a></li>
          <li class="nav-item"><a href="{{ url_for('logout') }}" class="btn btn-primary">Log out</a></li>
      </ul>
    </header>
  </div>
    <form style='text-align: center;' action="/" method="post">
        <textarea placeholder="What's on your mind...?" style='border-radius: 5px;' name="content"></textarea>
      <button class="btn btn-success" type="submit">Send</button>
    </form>
    {% for message in messages: %}
    <hr>
    <div style="margin-left: 10px;">
        <p>{{ message['USER'] }} <span style="margin-left: 10px">{{ message['TIME'] }}</span></p>
        <p>{{ message['CONTENT'] }}</p>
    </div>
    {% endfor %}
    <hr>
     <footer style="text-align: center;">
        <p>©️ Andrei Ivan {{ year }}</p>
    </footer>
</body>
</html>
