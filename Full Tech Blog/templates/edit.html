{% block content %} {% include "header.html" %}

<!-- Page Header -->
<header
  class="masthead"
  style="background-image: url('../static/assets/img/edit-bg.jpg')"
>
  <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="page-heading">
          <!-- TODO: Show a different h1 if editing existing post -->
          <h1>Edit Post</h1>
          <span class="subheading"
            >You're going to make a great blog post!</span
          >
        </div>
      </div>
    </div>
  </div>
</header>

<main class="mb-4">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
        <form action="/modify/{{ pid }}" method="post">
          <label>Post Title:</label>
          <input type="text" name="title" id="title" required placeholder="{{ post['title'] }}">
          <br>
          <label>Post Subtitle:</label>
          <input type="text" name="subtitle" required placeholder="{{ post['subtitle'] }}">
          <br>
          <label>Author:</label>
          <input type="text" name="author" required placeholder="{{ post['author'] }}">
          <br>
          <label>Image URL:</label>
          <input type="url" name="url" required placeholder="{{ post['img_url'] }}">
          <br>
          {{ ckeditor.create(value=post['body']) }}
          <input type="submit">
        </form>
      </div>
    </div>
  </div>
</main>
{% include "footer.html" %} {% endblock %}
